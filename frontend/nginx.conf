# The production frontend image (Dockerfile, target prod): serves the static
# build only. The reverse proxy in front routes /api/ and /media/ to the
# backend (docs/deployment.md, section 4) and terminates TLS.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The SPA's Content-Security-Policy is a <meta> in index.html
    # (vite.config.ts); frame-ancestors can't be set that way, so it goes
    # here as a header. add_header in a location replaces the server's, so
    # every location that adds its own repeats these.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed file names: a new build gets new names, so cache them for good.
    # The Dockerfile compresses them, for whoever accepts it.
    location /assets/ {
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes fall back to index.html, which is never cached so a
    # new deployment is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
