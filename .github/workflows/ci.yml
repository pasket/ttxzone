name: CI

# Every push to main and every pull request, as usual: each commit gets its
# status. A burst of pushes doesn't pile up runs, since a newer one cancels
# the run still in progress (concurrency below).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # images.yml, before publishing a release

# A newer push to the same branch/PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    # The suite takes ~14 minutes on a hosted runner (8 locally); a hang
    # still ends here.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: ttx_admin
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ttx_zone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttx_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values, same shape as tests/conftest.py's defaults.
      POSTGRES_USER: ttx_admin
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-secret-key-not-for-production
      DATA_ENCRYPTION_KEY: dGVzdC1rZXktbm90LWZvci1wcm9kdWN0aW9uLTMyYnk=
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      # The documentation site's API reference is built from this file.
      - name: API description matches the documentation site
        env:
          POSTGRES_DB: ttx_zone_test # the import needs one; nothing connects
        run: python -m scripts.export_openapi | diff - ../docs/site/schemas/openapi.json

      # The test suite builds its schema with SQLModel.create_all, so it
      # never runs a migration. This step is the only thing that proves the
      # Alembic chain applies from an empty database and matches the models.
      - name: Migrations apply from scratch and match the models
        env:
          POSTGRES_DB: ttx_zone_migrations
          PGPASSWORD: ci-password
        run: |
          psql -h localhost -U ttx_admin -d ttx_zone_test -c "CREATE DATABASE ttx_zone_migrations"
          alembic upgrade head
          alembic check

      - name: Tests
        env:
          POSTGRES_DB: ttx_zone_test
          # Lines only: measuring branches too takes the suite from 8 to 12
          # minutes here, and this job's timeout is 30 with 19 already used.
          COVERAGE_CORE: sysmon
        run: pytest -q --cov=app --cov-report=term:skip-covered

      # To read, not a gate: a threshold would only fail on unrelated changes.
      - name: Coverage in the run's summary
        run: |
          echo "Backend coverage: lines $(coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (lint, types, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22" # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format (prettier --check)
        run: npm run format:check

      - name: Type-check and build
        run: npm run build

      - name: Tests
        run: npm test -- --coverage

      - name: Coverage in the run's summary
        run: |
          node -e "const {total: t} = require('./coverage/coverage-summary.json');
            console.log('Frontend coverage: lines ' + t.lines.pct + '%, branches ' + t.branches.pct + '%')" \
            >> "$GITHUB_STEP_SUMMARY"

  # Blocking: known-vulnerable dependencies (pip-audit, npm audit at high)
  # and risky code patterns (bandit) fail the run. A new upstream advisory
  # can therefore turn CI red on an unrelated change -- fix it (usually
  # `npm audit fix` or a pin bump) rather than muting the job.
  # Builds the documentation site; its link check and page check run in the
  # build. Nothing is published.
  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4" # Astro's minimum
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # While the repository is private this is how to share the site: download
      # it from the run and serve the folder locally.
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: docs/site/dist
          retention-days: 7

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install audit tools
        run: pip install pip-audit bandit

      - name: Python dependencies (pip-audit)
        if: ${{ !cancelled() }}
        run: pip-audit -r backend/requirements.txt

      # Development and test tools too (pytest, pypdf...): they run on
      # contributors' machines and in CI with untrusted inputs.
      - name: Python dev dependencies (pip-audit)
        if: ${{ !cancelled() }}
        run: pip-audit -r backend/requirements-dev.txt

      - name: Python code (bandit)
        if: ${{ !cancelled() }}
        run: bandit -r backend/app -q

      - name: npm dependencies (npm audit)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: npm dependencies of the documentation site (npm audit)
        if: ${{ !cancelled() }}
        working-directory: docs/site
        run: npm audit --audit-level=high

  # The production images build (Dockerfile target prod), run as non-root and
  # pass their own health check -- the backend both as the API and as the
  # worker (APP_ROLE=worker). The backend gets a throwaway Postgres for
  # its start-up migration. Nothing is pushed.
  images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build backend (target prod)
        run: docker build --target prod -t ttxzone-backend:ci backend

      - name: Build frontend (target prod)
        run: |
          docker build --target prod \
            --build-arg VITE_COMMIT_SHA="$GITHUB_SHA" \
            --build-arg VITE_COMMIT_DATE="$(git log -1 --format=%cI)" \
            -t ttxzone-frontend:ci frontend

      # Blocking, like the security job: a fix published upstream for an OS
      # package or a dependency turns CI red until the images take it
      # (rebuild; the prod stages upgrade the base image's packages).
      - name: No fixable HIGH or CRITICAL vulnerability in the images
        run: |
          for image in ttxzone-backend:ci ttxzone-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.2 image --exit-code 1 --no-progress \
              --severity HIGH,CRITICAL --ignore-unfixed "$image"
          done

      - name: Both start as non-root and become healthy
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=ttx_admin -e POSTGRES_PASSWORD=ci-password -e POSTGRES_DB=ttx_zone \
            postgres:16-alpine
          until docker exec db pg_isready -U ttx_admin -d ttx_zone; do sleep 1; done
          docker run -d --name backend --network smoke \
            -e POSTGRES_HOST=db -e POSTGRES_USER=ttx_admin -e POSTGRES_PASSWORD=ci-password \
            -e POSTGRES_DB=ttx_zone -e SECRET_KEY=ci-secret-key-not-for-production \
            -e DATA_ENCRYPTION_KEY=dGVzdC1rZXktbm90LWZvci1wcm9kdWN0aW9uLTMyYnk= \
            ttxzone-backend:ci
          docker run -d --name worker --network smoke \
            -e APP_ROLE=worker -e RUN_MIGRATIONS=false \
            -e POSTGRES_HOST=db -e POSTGRES_USER=ttx_admin -e POSTGRES_PASSWORD=ci-password \
            -e POSTGRES_DB=ttx_zone -e SECRET_KEY=ci-secret-key-not-for-production \
            -e DATA_ENCRYPTION_KEY=dGVzdC1rZXktbm90LWZvci1wcm9kdWN0aW9uLTMyYnk= \
            ttxzone-backend:ci
          docker run -d --name frontend -p 127.0.0.1:8080:8080 ttxzone-frontend:ci
          for c in backend worker frontend; do
            for _ in $(seq 60); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ] && break
              sleep 2
            done
            docker inspect -f '{{.State.Health.Status}}' $c | grep -qx healthy \
              || { docker logs $c; echo "$c is not healthy"; exit 1; }
            [ "$(docker exec $c id -u)" != 0 ] || { echo "$c runs as root"; exit 1; }
          done

      # The browser tests run the Vite dev server, which has no chunks,
      # Content-Security-Policy or compressed assets. This is the built image.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: The frontend image works in a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:build

      - name: The production Compose files are valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
          TTX_PUBLIC_SERVER_NAME=play.example.org \
            docker compose -f deploy/docker-compose.yml --profile public config -q
          TTX_DB_BIND=10.0.0.5:5432 TTX_UPLOADS_PATH=/mnt/ttx-uploads \
            docker compose -f deploy/docker-compose.yml -f deploy/public-host/internal-host.yml config -q
          cp deploy/public-host/.env.example deploy/public-host/.env
          docker compose -f deploy/public-host/docker-compose.yml config -q
