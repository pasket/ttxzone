name: E2E

# Browser tests (docs/features/e2e-tests.md): on demand, and before publishing
# a release (images.yml). Not part of CI's regular runs.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22" # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: What the backend said
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color --tail=200 backend

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
