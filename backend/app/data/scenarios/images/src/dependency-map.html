<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="size" content="1400x820">
<title>Dependency map</title>
<link rel="stylesheet" href="../../../injects/images/src/base.css">
<style>
  svg { display: block; }
  text { font: 14px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #d8dde6; }
  .zone { fill: #161a22; stroke: #2f3644; }
  .zone-name { font-size: 12px; fill: #8a93a3; letter-spacing: .08em; text-transform: uppercase; }
  .hub { fill: #33222a; stroke: #b3262b; stroke-width: 2; }
  .node { fill: #2a1f24; stroke: #b3262b; }
  .warn { fill: #2c2619; stroke: #c96a12; }
  .safe { fill: #17271f; stroke: #1f7a4f; }
  .name { font-size: 14px; font-weight: 600; text-anchor: middle; }
  .sub { font-size: 12px; fill: #8a93a3; text-anchor: middle; }
  .edge { stroke: #b3262b; stroke-width: 2; }
  .edge-w { stroke: #c96a12; stroke-width: 2; stroke-dasharray: 6 5; }
  .label { font-size: 13px; }
</style>
</head>
<body class="dark">
<div class="bar"><span data-es="Mapa de dependencias · Funciones del negocio">Dependency map · Business functions</span></div>
<svg width="1400" height="776" viewBox="0 0 1400 776">
  <rect class="zone" x="20" y="20" width="960" height="700" rx="6"/>

  <rect class="zone" x="1000" y="20" width="380" height="700" rx="6"/>
  <text class="zone-name" x="1018" y="704" data-es="Otro proveedor / propio">Other provider / own</text>

  <!-- edges from hub -->
  <line class="edge" x1="500" y1="370" x2="140" y2="110"/>
  <line class="edge" x1="500" y1="370" x2="380" y2="80"/>
  <line class="edge" x1="500" y1="370" x2="620" y2="80"/>
  <line class="edge" x1="500" y1="370" x2="860" y2="110"/>
  <line class="edge" x1="500" y1="370" x2="140" y2="370"/>
  <line class="edge" x1="500" y1="370" x2="860" y2="370"/>
  <line class="edge-w" x1="500" y1="370" x2="140" y2="620"/>
  <line class="edge" x1="500" y1="370" x2="380" y2="650"/>
  <line class="edge" x1="500" y1="370" x2="620" y2="650"/>
  <line class="edge-w" x1="500" y1="370" x2="860" y2="620"/>

  <rect class="hub" x="370" y="320" width="260" height="100" rx="8"/>

  <text class="sub" x="500" y="388" data-es="Caída global">Global outage</text>

  <rect class="node" x="40" y="70" width="200" height="70" rx="6"/>
  <text class="name" x="140" y="100" data-es="Correo">Email</text><text class="sub" x="140" y="122" data-es="Incluido el de tiendas">Stores included</text>
  <rect class="node" x="280" y="40" width="200" height="70" rx="6"/>

  <rect class="node" x="520" y="40" width="200" height="70" rx="6"/>

  <rect class="node" x="760" y="70" width="200" height="70" rx="6"/>
  <text class="name" x="860" y="100" data-es="War room">War room</text><text class="sub" x="860" y="122" data-es="Puente, paneles, chat">Bridge, dashboards, chat</text>
  <rect class="warn" x="40" y="335" width="200" height="70" rx="6"/>
  <text class="name" x="140" y="365" data-es="Identidad y MFA">Identity and MFA</text><text class="sub" x="140" y="387" data-es="Intermitente">Intermittent</text>
  <rect class="node" x="760" y="335" width="200" height="70" rx="6"/>

  <text class="name" x="620" y="645" data-es="Buzones del BPO">BPO mailboxes</text><text class="sub" x="620" y="667" data-es="Y formulario web">And web form</text>
  <rect class="warn" x="760" y="585" width="200" height="70" rx="6"/>
  <text class="name" x="860" y="615" data-es="Protección del correo">Email protection</text><text class="sub" x="860" y="637" data-es="Degradada">Degraded</text>

  <rect class="safe" x="1090" y="80" width="200" height="70" rx="6"/>

  <rect class="safe" x="1090" y="230" width="200" height="70" rx="6"/>

  <rect class="safe" x="1090" y="380" width="200" height="70" rx="6"/>
  <text class="name" x="1190" y="410" data-es="Cajas de tienda">Store tills</text><text class="sub" x="1190" y="432" data-es="Propio">Own</text>
  <rect class="safe" x="1090" y="530" width="200" height="70" rx="6"/>
  <text class="name" x="1190" y="560" data-es="Gestión de almacenes">Warehouse system</text><text class="sub" x="1190" y="582" data-es="Propio">Own</text>

  <line class="edge" x1="40" y1="752" x2="84" y2="752"/>
  <text class="label" x="94" y="757" data-es="Caído">Down</text>
  <line class="edge-w" x1="170" y1="752" x2="214" y2="752"/>
  <text class="label" x="224" y="757" data-es="Degradado">Degraded</text>
  <rect class="safe" x="330" y="744" width="16" height="16" rx="3"/>
  <text class="label" x="354" y="757" data-es="Funciona">Working</text>
</svg>
<div class="stamp" data-es="Ficticio · material de ejercicio">Fictitious · exercise material</div>
<script src="../../../injects/images/src/i18n.js"></script>

</html>
